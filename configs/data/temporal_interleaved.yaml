# Time-ordered mixed-modal dataset for prefix-to-future interleaved prediction.
_target_: tuna.data.datasets.temporal_interleaved_dataset.TemporalInterleavedDataset
jsonl_path: ./data_examples/temporal_interleaved.jsonl
image_root: ./data_examples
image_size: 512
num_frames: 1
max_text_length: 8192
max_images: 5
center_crop: true
include_time_token: true
noise_all_images_prob: 0.3
min_prefix_images: 1
condition_dropout_prob: 0.1
drop_prefix_text_prob: 0.1
drop_prefix_visual_prob: 0.0
