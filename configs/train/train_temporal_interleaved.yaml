# =============================================================================
# Tuna-2 temporal interleaved training config.
#
# This keeps the default `train.yaml` unchanged and adds a Show-o2-style
# prefix-to-future mixed-modal stream only when this config is selected:
#
#   python -m tuna.scripts.train --config-name train_temporal_interleaved \
#       model.load_stage1_model=/path/to/foundation_ckpt.pt
# =============================================================================

defaults:
  - model: tuna_2_pixel_7b
  - _self_

data:
  sync_sampling: true
  sampling_weights:
    t2i: 0.45
    edit: 0.20
    mmu: 0.20
    text: 0.10
    temporal: 0.05

  streams:
    t2i:
      _target_: tuna.data.datasets.ti_dataset.TIDataset
      jsonl_path: ./data_examples/ti_pairs.jsonl
      image_root: ./data_examples
      image_size: 512
      data_type: t2i
      max_text_length: 2048
      center_crop: true
      multi_resolution: true
      batch_size: 1
      num_workers: 8

    edit:
      _target_: tuna.data.datasets.edit_dataset.EditDataset
      jsonl_path: ./data_examples/edit_pairs.jsonl
      image_root: ./data_examples
      image_size: 512
      max_text_length: 4096
      center_crop: true
      batch_size: 1
      num_workers: 8

    mmu:
      _target_: tuna.data.datasets.ti_dataset.TIDataset
      jsonl_path: ./data_examples/mmu_pairs.jsonl
      image_root: ./data_examples
      image_size: 512
      data_type: mmu
      max_text_length: 4096
      center_crop: true
      multi_resolution: true
      batch_size: 1
      num_workers: 8

    text:
      _target_: tuna.data.datasets.ti_dataset.TIDataset
      jsonl_path: ./data_examples/text_only.jsonl
      image_root: ./data_examples
      image_size: 512
      data_type: mmu_text
      max_text_length: 4096
      center_crop: true
      batch_size: 3
      num_workers: 8

    temporal:
      _target_: tuna.data.datasets.temporal_interleaved_dataset.TemporalInterleavedDataset
      jsonl_path: ./data_examples/temporal_interleaved.jsonl
      image_root: ./data_examples
      image_size: 512
      num_frames: 1
      max_text_length: 8192
      max_images: 5
      center_crop: true
      include_time_token: true
      noise_all_images_prob: 0.3
      min_prefix_images: 1
      condition_dropout_prob: 0.1
      drop_prefix_text_prob: 0.1
      drop_prefix_visual_prob: 0.0
      batch_size: 1
      num_workers: 4

training:
  output_dir: ./outputs/train_temporal_interleaved
  max_epochs: 1
  max_steps_per_epoch: 1000000
  learning_rate: 2.0e-5
  weight_decay: 1.0e-2
  warmup_steps: 1000
  batch_size: 4
  num_workers: 8
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  ema_decay: 0.9999
  save_every: 500
  keep_last: 3
  gc_interval: 5001
  fsdp:
    enable: true
    sharding_strategy: SHARD_GRAD_OP
    state_dict_type: SHARDED_STATE_DICT
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      cast_root_forward_inputs: true
