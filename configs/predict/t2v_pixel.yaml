# Encoder-free Tuna-2 pixel text-to-video prediction.

defaults:
  - model: tuna_2_pixel_7b
  - _self_

prompt: "a short video of a croissant on a plate"

inference:
  inference_mode: t2i
  pipe: Tuna2PixelPipeline
  generation_mode: t2i_pixel
  output_dir: ./outputs/predictions/t2v_pixel
  height: 512
  width: 512
  latent_frames: 4
  guidance_scale: 3.0
  num_inference_steps: 50
  num_images_per_prompt: 1
  seed: 42
  weight_dtype: bf16
  noise_scale: 1.0
  sampling_method: euler
  cfg_interval: [0, 1.0]
  negative_prompt: "low quality, blurry, distorted, flickering, inconsistent motion"
