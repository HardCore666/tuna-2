model:
  _target_: tuna.models.tuna_2_pixel.Tuna2PixelModel
  llm_model_path: Qwen/Qwen2.5-7B-Instruct
  load_stage1_model: null
  frozen_params:
  - vae
  hidden_size: 3584
  num_attention_heads: 56
  num_key_value_heads: 14
  attention_backend: sdpa
  patch_size: 16
  image_latent_dim: 3
  image_latent_height: 16
  image_latent_width: 16
  hq_image_latent_height: 64
  hq_image_latent_width: 64
  mixed_modal_latent_height: 32
  mixed_modal_latent_width: 32
  add_time_embeds: true
  add_aspect_ratio_embeds: false
  mrope_type: dit_3drope_mm
  reshape_frame_to_batch_dim: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  enable_mask_token: true
  masked_image_ratio: 0.3
  masked_image_ratio_min: -0.7
  mmu_noise_prob: 0.1
  mmu_noise_level: 0.1
  path_type: Linear
  prediction: velocity
  snr_type: lognorm
  do_shift: true
  ntp_coeff: 1.0
  flow_coeff: 1.0
  und_max_t0: 1.0
  sampling_method: euler
  guidance_scale: 7.5
  num_inference_steps: 50
  time_shifting_factor: 3.0
  atol: 1.0e-06
  rtol: 0.001
  reverse: false
  dtype: bf16
  flow_head_num: 16
  noise_scale: 2.0
data:
  _target_: tuna.data.datasets.video_dataset.VideoDataset
  jsonl_path: ./data_examples/video_pairs.jsonl
  image_root: ./data_examples
  image_size: 512
  num_frames: 4
  encoder_free: true
  patch_size: 16
  include_time_token: true
  max_text_length: 8192
  center_crop: true
  batch_size: 1
  num_workers: 4
training:
  output_dir: ./outputs/video_t2v_pixel
  max_epochs: 1
  max_steps_per_epoch: 1
  learning_rate: 2.0e-05
  weight_decay: 0.01
  warmup_steps: 1000
  batch_size: 1
  num_workers: 4
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  ema_decay: 0.9999
  save_every: 500
  keep_last: 3
  gc_interval: 5001
  fsdp:
    enable: false
    sharding_strategy: SHARD_GRAD_OP
    state_dict_type: SHARDED_STATE_DICT
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      cast_root_forward_inputs: true
